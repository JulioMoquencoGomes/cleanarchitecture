networks:
  dev:
    driver: bridge

services:
  app:
    build: .
    image: webapi
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__default=Host=db;Database=cleanapp;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - dev

  db:
    image: postgres:16.9-bullseye
    container_name: postgres_db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=cleanapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev

volumes:
  postgres_data: